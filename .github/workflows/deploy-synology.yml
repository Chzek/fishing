name: Test & Deploy to Synology NAS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fishing_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Copy CI Environment File
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=mysql/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=fishinglog/DB_DATABASE=fishing_test/' .env
          sed -i 's/DB_USERNAME=sail/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=password/DB_PASSWORD=password/' .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Encryption Key
        run: php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fishing_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Execute Full Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fishing_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  deploy:
    name: Deploy to Synology NAS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: SSH and Trigger NAS Deployment Script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_PORT || 22 }}
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/var/packages/Git/target/bin:/var/packages/Git/target/usr/bin:/var/packages/ContainerManager/target/usr/bin:/var/packages/Docker/target/usr/bin:$PATH"
            [ -f /etc/profile ] && source /etc/profile 2>/dev/null || true
            [ -f ~/.profile ] && source ~/.profile 2>/dev/null || true
            cd ${{ secrets.NAS_PROJECT_PATH }}
            git config --global --add safe.directory '*' 2>/dev/null || true
            if [ ! -d ".git" ]; then
                echo "--> Initializing Git repository on Synology NAS..."
                git init
                git remote add origin https://github.com/Chzek/fishing.git 2>/dev/null || git remote set-url origin https://github.com/Chzek/fishing.git
            fi
            git fetch origin master
            git reset --hard origin/master
            bash synology-nas-deploy/update_nas.sh
